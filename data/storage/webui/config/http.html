<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HTTP — openHASP</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav><a href="/config">← Настройки</a></nav>
  <h1>HTTP</h1>

  <form id="f">
    <div>
      <label for="user">Пользователь</label>
      <input id="user" name="user" type="text" maxlength="31" autocomplete="username">
    </div>
    <div>
      <label for="password">Пароль (пусто = без авторизации)</label>
      <input id="password" name="password" type="password" maxlength="63" placeholder="••••••" autocomplete="new-password">
    </div>
    <div>
      <label for="port">Порт (требуется перезагрузка)</label>
      <input id="port" name="port" type="number" min="1" max="65535" required>
    </div>
    <div class="row">
      <button type="submit">Сохранить</button>
      <a class="button" href="/config">Отмена</a>
    </div>
    <div id="status"></div>
  </form>

<script src="/config/form.js"></script>
<script>bindConfigForm("http", ["user", "password", "port"], { port: "int" });</script>
</body>
</html>
