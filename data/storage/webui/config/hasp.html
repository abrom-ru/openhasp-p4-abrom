<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HASP — openHASP</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav><a href="/config">← Настройки</a></nav>
  <h1>HASP</h1>

  <form id="f">
    <div>
      <label for="theme">Тема (0=default LVGL, 1=simple, 2=dark, 8=hasp)</label>
      <input id="theme" name="theme" type="number" min="0" max="8" required>
    </div>
    <div>
      <label for="startpage">Стартовая страница (1..12)</label>
      <input id="startpage" name="startpage" type="number" min="1" max="12" required>
    </div>
    <div class="row">
      <button type="submit">Сохранить</button>
      <a class="button" href="/config">Отмена</a>
    </div>
    <div id="status"></div>
  </form>

<script src="/config/form.js"></script>
<script>bindConfigForm(
  "hasp",
  ["theme", "startpage"],
  { theme: "int", startpage: "int" }
);</script>
</body>
</html>
