<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>openHASP</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1 id="host">openHASP</h1>

  <h2>Информация</h2>
  <div id="info">Загрузка…</div>

  <h2>Разделы</h2>
  <div class="row">
    <a class="button" href="/config">Настройки</a>
    <a class="button" href="/info">Статус (JSON)</a>
    <a class="button" href="/console.html">Консоль</a>
  </div>

  <h2>Действия</h2>
  <div class="row">
    <button id="reboot" class="red">Перезагрузка</button>
  </div>
  <div id="status"></div>

<script>
"use strict";

function setStatus(msg, cls) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = cls || "";
}

async function loadInfo() {
  try {
    const r = await fetch("/info", { credentials: "same-origin" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();

    document.getElementById("host").textContent = j.node || "openHASP";

    const rows = [
      ["Версия",   j.version],
      ["IP",       j.ip],
      ["SSID",     j.ssid],
      ["RSSI",     j.rssi != null ? j.rssi + " dBm" : ""],
      ["Uptime",   j.uptime + " с"],
      ["Heap",     j.heapFree ? (j.heapFree + " B") : ""],
      ["Страница", j.page + " / " + j.numPages],
      ["Экран",    (j.tftWidth || "?") + "×" + (j.tftHeight || "?")],
    ];

    const html = rows
      .filter(r => r[1] !== undefined && r[1] !== "")
      .map(r => `<div><span style="color:#888">${r[0]}:</span> ${r[1]}</div>`)
      .join("");

    document.getElementById("info").innerHTML = html;
  } catch (e) {
    document.getElementById("info").textContent = "Ошибка: " + e.message;
  }
}

document.getElementById("reboot").addEventListener("click", async () => {
  if (!confirm("Перезагрузить плату?")) return;

  setStatus("Отправляю команду reboot…", "info");
  try {
    const r = await fetch("/api/reboot", { method: "POST", credentials: "same-origin" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    setStatus("Перезагрузка через 1 с…", "ok");
  } catch (e) {
    setStatus("Ошибка: " + e.message, "err");
  }
});

loadInfo();
</script>
</body>
</html>
